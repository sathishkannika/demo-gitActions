name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.0.0, v2.3.1

env:
  RUNNER: ubuntu-latest

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build & Test before releasing
  # ─────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ${{ env.RUNNER }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run full verify (tests + JaCoCo 80% gate)
        run: mvn --batch-mode --no-transfer-progress verify -Pcoverage

  # ─────────────────────────────────────────────
  # JOB 2 — Package & Publish JAR artifact
  # ─────────────────────────────────────────────
  release:
    name: Release
    runs-on: ${{ env.RUNNER }}
    needs: verify

    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build release JAR (skip tests — already ran in verify job)
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true   # auto-generates changelog from commits
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Optional: publish to GitHub Packages (Maven repo) ────────────
      # Uncomment and add settings.xml if you want to push to a registry.
      #
      # - name: Publish to GitHub Packages
      #   run: mvn --batch-mode deploy -DskipTests
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
