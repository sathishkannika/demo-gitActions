name: Hotfix CI

on:
  push:
    branches:
      - 'hotfix/**'    # triggers on hotfix/fix-login, hotfix/CVE-1234, etc.
  pull_request:
    branches:
      - main
      - master
    head:
      - 'hotfix/**'

env:
  RUNNER: ubuntu-latest

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Fast Build (hotfixes must build fast)
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ${{ env.RUNNER }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn --batch-mode --no-transfer-progress clean compile

  # ─────────────────────────────────────────────
  # JOB 2 — Unit Tests (mandatory for hotfixes)
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ${{ env.RUNNER }}
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hotfix-surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/surefire-reports/*.xml
          fail_on_failure: true

  # ─────────────────────────────────────────────
  # JOB 3 — Coverage Gate (80% minimum)
  # Hotfixes must not regress coverage
  # ─────────────────────────────────────────────
  coverage:
    name: Coverage Gate (≥80%)
    runs-on: ${{ env.RUNNER }}
    needs: unit-tests

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run JaCoCo — enforce 80% line coverage
        run: mvn --batch-mode --no-transfer-progress verify -Pcoverage

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hotfix-jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 4 — Security scan (CVE check on hotfix)
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ${{ env.RUNNER }}
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        run: |
          mvn --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hotfix-owasp-report
          path: target/dependency-check-report.*
          retention-days: 7
