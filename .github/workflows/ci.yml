name: Spring Boot CI

on:
  pull_request:
    branches:
      - dev

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ── To change the runner for ALL jobs:
#    Option A (recommended): Set a repo variable called RUNNER in
#    GitHub → Settings → Secrets and variables → Actions → Variables
#    e.g. RUNNER = ubuntu-latest  or  RUNNER = self-hosted
#    The ${{ vars.RUNNER || 'ubuntu-latest' }} fallback below means it
#    works even if the variable is not set.
#
#    Option B: Replace the expression with a plain string here, e.g.
#    runs-on: ubuntu-22.04
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Compile with Maven
        run: mvn --batch-mode --no-transfer-progress clean compile

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: build-${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 2 — Unit Tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/surefire-reports/*.xml
          fail_on_failure: true

  # ─────────────────────────────────────────────
  # JOB 3 — Code Quality
  #   . Checkstyle  - style enforcement
  #   . SpotBugs    - bytecode bug analysis
  #   . JaCoCo      - code coverage (fails if < 70%)
  #   . PMD         - static code analysis
  #   . OWASP       - dependency vulnerability scan
  # ─────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn --batch-mode --no-transfer-progress checkstyle:check

      - name: Run SpotBugs
        run: mvn --batch-mode --no-transfer-progress spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7

      - name: Run JaCoCo coverage (threshold controlled in pom.xml)
        run: mvn --batch-mode --no-transfer-progress verify -Pcoverage

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Run PMD
        run: mvn --batch-mode --no-transfer-progress pmd:check

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: 7

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        run: |
          mvn --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-report
          path: target/dependency-check-report.*
          retention-days: 7
