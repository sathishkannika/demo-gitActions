name: Spring Boot CI

on:
  pull_request:
    branches:
      - dev

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ── Change the runner here once for all jobs ──────────────────────────────────
env:
  RUNNER: ubuntu-latest

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ${{ env.RUNNER }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Compile with Maven
        run: mvn --batch-mode --no-transfer-progress clean compile

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: build-${{ github.sha }}

  # ─────────────────────────────────────────────
  # JOB 2 — Unit Tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ${{ env.RUNNER }}
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: always()   # upload even on failure so results are visible
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/surefire-reports/*.xml
          fail_on_failure: true

  # ─────────────────────────────────────────────
  # JOB 3 — Code Quality
  #   · Checkstyle  — style enforcement
  #   · SpotBugs    — bytecode bug analysis
  #   · JaCoCo      — code coverage (fails if < 80%)
  #   · PMD         — static code analysis
  #   · OWASP       — dependency vulnerability scan
  # ─────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ${{ env.RUNNER }}
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # ── Checkstyle ────────────────────────────────────────────────────
      - name: Run Checkstyle
        run: mvn --batch-mode --no-transfer-progress checkstyle:check

      # ── SpotBugs ──────────────────────────────────────────────────────
      - name: Run SpotBugs
        run: mvn --batch-mode --no-transfer-progress spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7

      # ── JaCoCo — Code Coverage ────────────────────────────────────────
      # Runs tests with instrumentation and enforces an 80% line-coverage
      # minimum. Adjust the <minimum> in your pom.xml to suit your project.
      - name: Run JaCoCo coverage
        run: mvn --batch-mode --no-transfer-progress verify -Pcoverage

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      # ── PMD — Static Analysis ─────────────────────────────────────────
      # Detects common code smells: unused variables, empty catch blocks,
      # overly complex methods, etc.
      - name: Run PMD
        run: mvn --batch-mode --no-transfer-progress pmd:check

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: 7

      # ── OWASP Dependency-Check — Security Scan ────────────────────────
      # Flags dependencies with known CVEs. Fails on CVSS score ≥ 7 (HIGH).
      # First run downloads the NVD database (~10 min); subsequent runs use
      # the cache and complete in ~1–2 min.
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        run: |
          mvn --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.*
          retention-days: 7
