name: Dependency Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

env:
  RUNNER: ubuntu-latest

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — OWASP CVE Scan (full NVD database)
  # ─────────────────────────────────────────────
  owasp-scan:
    name: OWASP Dependency-Check
    runs-on: ${{ env.RUNNER }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP full scan
        run: |
          mvn --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-weekly-report-${{ github.run_number }}
          path: target/dependency-check-report.*
          retention-days: 30

      # ── Notify on Slack if vulnerabilities found ──────────────────────
      # Uncomment and add SLACK_WEBHOOK_URL to secrets.
      #
      # - name: Notify Slack on failure
      #   if: failure()
      #   uses: slackapi/slack-github-action@v1.27.0
      #   with:
      #     payload: '{"text":"⚠️ OWASP scan found vulnerabilities in ${{ github.repository }}"}'
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ─────────────────────────────────────────────
  # JOB 2 — Check for Maven dependency updates
  # ─────────────────────────────────────────────
  versions-check:
    name: Check Dependency Versions
    runs-on: ${{ env.RUNNER }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Report outdated dependencies
        # Does NOT fail the build — informational only
        run: |
          mvn --batch-mode --no-transfer-progress \
            versions:display-dependency-updates \
            versions:display-plugin-updates

      - name: Upload versions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versions-report-${{ github.run_number }}
          path: target/versions-*.txt
          retention-days: 14
