version: 2

updates:
  # ── Maven dependencies ────────────────────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "your-org/backend-team"
    assignees:
      - "your-org/backend-team"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
    # Group all patch updates into a single PR to reduce noise
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
      test-libs:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"

  # ── GitHub Actions ────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "your-org/devops-team"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
